<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif"><defs><marker id="a9a9aa6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a9aa6"/></marker><marker id="a4cc38a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4cc38a"/></marker><marker id="aff7b72" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff7b72"/></marker></defs><rect width="960" height="470" fill="#0d1117"/><rect x="20" y="30" width="200" height="90" rx="10" fill="#161b22" stroke="#3a3f48" stroke-width="1.5"/><circle cx="38" cy="50" r="11" fill="#8b8bff"/><text x="38" y="54.5" text-anchor="middle" font-size="12" font-weight="700" fill="#0d1117">1</text><text x="56" y="55" font-size="15" font-weight="700" fill="#e6e6ea">Ticket</text><text x="34" y="78" font-size="12.5" fill="#9a9aa6">Customer message plus</text><text x="34" y="96" font-size="12.5" fill="#9a9aa6">the customer's id</text><rect x="270" y="30" width="230" height="90" rx="10" fill="#161b22" stroke="#3a3f48" stroke-width="1.5"/><circle cx="288" cy="50" r="11" fill="#8b8bff"/><text x="288" y="54.5" text-anchor="middle" font-size="12" font-weight="700" fill="#0d1117">2</text><text x="306" y="55" font-size="15" font-weight="700" fill="#e6e6ea">callModel()</text><text x="284" y="78" font-size="12.5" fill="#9a9aa6">Claude with an API key,</text><text x="284" y="96" font-size="12.5" fill="#9a9aa6">recorded replies without one</text><rect x="560" y="30" width="380" height="110" rx="10" fill="#1c1f3a" stroke="#8b8bff" stroke-width="1.5"/><circle cx="578" cy="50" r="11" fill="#8b8bff"/><text x="578" y="54.5" text-anchor="middle" font-size="12" font-weight="700" fill="#0d1117">3</text><text x="596" y="55" font-size="15" font-weight="700" fill="#e6e6ea">gate(tool, input, context)</text><text x="574" y="78" font-size="12.5" fill="#9a9aa6">Pure function, runs before every tool call.</text><text x="574" y="96" font-size="12.5" fill="#9a9aa6">Unknown tool, close_account: always no.</text><text x="574" y="114" font-size="12.5" fill="#9a9aa6">refund: own account, not already refunded,</text><text x="574" y="132" font-size="12.5" fill="#9a9aa6">within the charge, A$100 per ticket.</text><rect x="560" y="200" width="180" height="90" rx="10" fill="#161b22" stroke="#4cc38a" stroke-width="1.5"/><circle cx="578" cy="220" r="11" fill="#8b8bff"/><text x="578" y="224.5" text-anchor="middle" font-size="12" font-weight="700" fill="#0d1117">4</text><text x="596" y="225" font-size="15" font-weight="700" fill="#e6e6ea">Run the tool</text><text x="574" y="248" font-size="12.5" fill="#9a9aa6">lookup, refund, escalate</text><text x="574" y="266" font-size="12.5" fill="#9a9aa6">result goes back</text><rect x="760" y="200" width="180" height="90" rx="10" fill="#161b22" stroke="#ff7b72" stroke-width="1.5"/><circle cx="778" cy="220" r="11" fill="#8b8bff"/><text x="778" y="224.5" text-anchor="middle" font-size="12" font-weight="700" fill="#0d1117">4</text><text x="796" y="225" font-size="15" font-weight="700" fill="#e6e6ea">Blocked</text><text x="774" y="248" font-size="12.5" fill="#9a9aa6">the reason and next step</text><text x="774" y="266" font-size="12.5" fill="#9a9aa6">go back as an error</text><rect x="270" y="200" width="230" height="90" rx="10" fill="#161b22" stroke="#3a3f48" stroke-width="1.5"/><circle cx="288" cy="220" r="11" fill="#8b8bff"/><text x="288" y="224.5" text-anchor="middle" font-size="12" font-weight="700" fill="#0d1117">5</text><text x="306" y="225" font-size="15" font-weight="700" fill="#e6e6ea">Final reply</text><text x="284" y="248" font-size="12.5" fill="#9a9aa6">Outcome: escalated if escalate</text><text x="284" y="266" font-size="12.5" fill="#9a9aa6">ran, refused if anything was</text><text x="284" y="284" font-size="12.5" fill="#9a9aa6">blocked, else resolved</text><rect x="20" y="350" width="480" height="100" rx="10" fill="#161b22" stroke="#3a3f48" stroke-width="1.5"/><circle cx="38" cy="370" r="11" fill="#8b8bff"/><text x="38" y="374.5" text-anchor="middle" font-size="12" font-weight="700" fill="#0d1117">6</text><text x="56" y="375" font-size="15" font-weight="700" fill="#e6e6ea">Postgres</text><text x="34" y="398" font-size="12.5" fill="#9a9aa6">runs: steps, reply and outcome per ticket</text><text x="34" y="416" font-size="12.5" fill="#9a9aa6">refunds: one row per refund</text><text x="34" y="434" font-size="12.5" fill="#9a9aa6">CHECK (amount_cents &lt;= 10000): the backstop if gate() has a bug</text><rect x="560" y="350" width="380" height="100" rx="10" fill="#161b22" stroke="#3a3f48" stroke-width="1.5"/><circle cx="578" cy="370" r="11" fill="#8b8bff"/><text x="578" y="374.5" text-anchor="middle" font-size="12" font-weight="700" fill="#0d1117">7</text><text x="596" y="375" font-size="15" font-weight="700" fill="#e6e6ea">Inbox and Eval screens</text><text x="574" y="398" font-size="12.5" fill="#9a9aa6">Inbox: tool calls as rows, allowed or blocked</text><text x="574" y="416" font-size="12.5" fill="#9a9aa6">Eval: 30 tickets, expected against actual, total</text><line x1="220" y1="75" x2="268" y2="75" stroke="#9a9aa6" stroke-width="1.8" marker-end="url(#a9a9aa6)"/><line x1="500" y1="75" x2="558" y2="75" stroke="#9a9aa6" stroke-width="1.8" marker-end="url(#a9a9aa6)"/><text x="505" y="66" font-size="12" fill="#9a9aa6" font-weight="600">tool_use</text><line x1="650" y1="140" x2="650" y2="198" stroke="#4cc38a" stroke-width="1.8" marker-end="url(#a4cc38a)"/><text x="658" y="175" font-size="12" fill="#4cc38a" font-weight="600">allowed</text><line x1="850" y1="140" x2="850" y2="198" stroke="#ff7b72" stroke-width="1.8" marker-end="url(#aff7b72)"/><text x="858" y="175" font-size="12" fill="#ff7b72" font-weight="600">blocked</text><path d="M650 290 V318 H530 V105 H503" fill="none" stroke="#9a9aa6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a9a9aa6)"/><path d="M850 290 V318 H650" fill="none" stroke="#9a9aa6" stroke-width="1.5" stroke-dasharray="5 4"/><text x="545" y="336" font-size="12" fill="#9a9aa6">tool_result goes back for the next turn</text><line x1="385" y1="120" x2="385" y2="198" stroke="#9a9aa6" stroke-width="1.8" marker-end="url(#a9a9aa6)"/><text x="393" y="165" font-size="12" fill="#9a9aa6" font-weight="600">end_turn</text><line x1="385" y1="290" x2="385" y2="348" stroke="#9a9aa6" stroke-width="1.8" marker-end="url(#a9a9aa6)"/><line x1="500" y1="400" x2="558" y2="400" stroke="#9a9aa6" stroke-width="1.8" marker-end="url(#a9a9aa6)"/></svg>