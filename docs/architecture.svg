<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif"><defs><marker id="a127a46" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#127a46"/></marker><marker id="a5e5e68" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5e5e68"/></marker><marker id="ab42318" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b42318"/></marker></defs><rect width="960" height="470" fill="#ffffff"/><rect x="20" y="30" width="200" height="90" rx="10" fill="#f6f6f8" stroke="#c9c9d1" stroke-width="1.5"/><circle cx="38" cy="50" r="11" fill="#3b3bd6"/><text x="38" y="54.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text><text x="56" y="55" font-size="15" font-weight="700" fill="#1a1a1f">Ticket</text><text x="34" y="78" font-size="12.5" fill="#5e5e68">Customer message plus</text><text x="34" y="96" font-size="12.5" fill="#5e5e68">the customer's id</text><rect x="270" y="30" width="230" height="90" rx="10" fill="#f6f6f8" stroke="#c9c9d1" stroke-width="1.5"/><circle cx="288" cy="50" r="11" fill="#3b3bd6"/><text x="288" y="54.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text><text x="306" y="55" font-size="15" font-weight="700" fill="#1a1a1f">callModel()</text><text x="284" y="78" font-size="12.5" fill="#5e5e68">Claude with an API key,</text><text x="284" y="96" font-size="12.5" fill="#5e5e68">recorded replies without one</text><rect x="560" y="30" width="380" height="110" rx="10" fill="#eef0fb" stroke="#3b3bd6" stroke-width="1.5"/><circle cx="578" cy="50" r="11" fill="#3b3bd6"/><text x="578" y="54.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text><text x="596" y="55" font-size="15" font-weight="700" fill="#1a1a1f">gate(tool, input, context)</text><text x="574" y="78" font-size="12.5" fill="#5e5e68">Pure function, runs before every tool call.</text><text x="574" y="96" font-size="12.5" fill="#5e5e68">Unknown tool, close_account: always no.</text><text x="574" y="114" font-size="12.5" fill="#5e5e68">refund: own account, not already refunded,</text><text x="574" y="132" font-size="12.5" fill="#5e5e68">within the charge, A$100 per ticket.</text><rect x="560" y="200" width="180" height="90" rx="10" fill="#f6f6f8" stroke="#127a46" stroke-width="1.5"/><circle cx="578" cy="220" r="11" fill="#3b3bd6"/><text x="578" y="224.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text><text x="596" y="225" font-size="15" font-weight="700" fill="#1a1a1f">Run the tool</text><text x="574" y="248" font-size="12.5" fill="#5e5e68">lookup, refund, escalate</text><text x="574" y="266" font-size="12.5" fill="#5e5e68">result goes back</text><rect x="760" y="200" width="180" height="90" rx="10" fill="#f6f6f8" stroke="#b42318" stroke-width="1.5"/><circle cx="778" cy="220" r="11" fill="#3b3bd6"/><text x="778" y="224.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text><text x="796" y="225" font-size="15" font-weight="700" fill="#1a1a1f">Blocked</text><text x="774" y="248" font-size="12.5" fill="#5e5e68">the reason and next step</text><text x="774" y="266" font-size="12.5" fill="#5e5e68">go back as an error</text><rect x="270" y="200" width="230" height="90" rx="10" fill="#f6f6f8" stroke="#c9c9d1" stroke-width="1.5"/><circle cx="288" cy="220" r="11" fill="#3b3bd6"/><text x="288" y="224.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">5</text><text x="306" y="225" font-size="15" font-weight="700" fill="#1a1a1f">Final reply</text><text x="284" y="248" font-size="12.5" fill="#5e5e68">Outcome: escalated if escalate</text><text x="284" y="266" font-size="12.5" fill="#5e5e68">ran, refused if anything was</text><text x="284" y="284" font-size="12.5" fill="#5e5e68">blocked, else resolved</text><rect x="20" y="350" width="480" height="100" rx="10" fill="#f6f6f8" stroke="#c9c9d1" stroke-width="1.5"/><circle cx="38" cy="370" r="11" fill="#3b3bd6"/><text x="38" y="374.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">6</text><text x="56" y="375" font-size="15" font-weight="700" fill="#1a1a1f">Postgres</text><text x="34" y="398" font-size="12.5" fill="#5e5e68">runs: steps, reply and outcome per ticket</text><text x="34" y="416" font-size="12.5" fill="#5e5e68">refunds: one row per refund</text><text x="34" y="434" font-size="12.5" fill="#5e5e68">CHECK (amount_cents &lt;= 10000): the backstop if gate() has a bug</text><rect x="560" y="350" width="380" height="100" rx="10" fill="#f6f6f8" stroke="#c9c9d1" stroke-width="1.5"/><circle cx="578" cy="370" r="11" fill="#3b3bd6"/><text x="578" y="374.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">7</text><text x="596" y="375" font-size="15" font-weight="700" fill="#1a1a1f">Inbox and Eval screens</text><text x="574" y="398" font-size="12.5" fill="#5e5e68">Inbox: tool calls as rows, allowed or blocked</text><text x="574" y="416" font-size="12.5" fill="#5e5e68">Eval: 30 tickets, expected against actual, total</text><line x1="220" y1="75" x2="268" y2="75" stroke="#5e5e68" stroke-width="1.8" marker-end="url(#a5e5e68)"/><line x1="500" y1="75" x2="558" y2="75" stroke="#5e5e68" stroke-width="1.8" marker-end="url(#a5e5e68)"/><text x="505" y="66" font-size="12" fill="#5e5e68" font-weight="600">tool_use</text><line x1="650" y1="140" x2="650" y2="198" stroke="#127a46" stroke-width="1.8" marker-end="url(#a127a46)"/><text x="658" y="175" font-size="12" fill="#127a46" font-weight="600">allowed</text><line x1="850" y1="140" x2="850" y2="198" stroke="#b42318" stroke-width="1.8" marker-end="url(#ab42318)"/><text x="858" y="175" font-size="12" fill="#b42318" font-weight="600">blocked</text><path d="M650 290 V318 H530 V105 H503" fill="none" stroke="#5e5e68" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a5e5e68)"/><path d="M850 290 V318 H650" fill="none" stroke="#5e5e68" stroke-width="1.5" stroke-dasharray="5 4"/><text x="545" y="336" font-size="12" fill="#5e5e68">tool_result goes back for the next turn</text><line x1="385" y1="120" x2="385" y2="198" stroke="#5e5e68" stroke-width="1.8" marker-end="url(#a5e5e68)"/><text x="393" y="165" font-size="12" fill="#5e5e68" font-weight="600">end_turn</text><line x1="385" y1="290" x2="385" y2="348" stroke="#5e5e68" stroke-width="1.8" marker-end="url(#a5e5e68)"/><line x1="500" y1="400" x2="558" y2="400" stroke="#5e5e68" stroke-width="1.8" marker-end="url(#a5e5e68)"/></svg>